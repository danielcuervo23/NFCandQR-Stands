name: Ping Supabase (evitar pausa por inactividad)

on:
  schedule:
    # Corre cada 3 días a las 09:00 UTC. Supabase pausa a los 7 días de
    # inactividad, así que con margen de sobra nunca se cumple ese plazo.
    - cron: "0 9 */3 * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase (cuenta como actividad)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
